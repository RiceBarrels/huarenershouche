<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>车来车网</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      background: #ffffff;
      color: #1c1917;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0C0A09; color: #e7e5e4; }
      .icon-circle { border-color: #292524; background: #1c1917; }
      .retry-btn { background: #e7e5e4; color: #0C0A09; }
      .retry-btn:active { background: #d6d3d1; }
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .icon-circle {
      width: 88px;
      height: 88px;
      border: 1px solid #e7e5e4;
      background: #fafaf9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .icon-circle svg {
      width: 36px;
      height: 36px;
      stroke: currentColor;
      stroke-width: 1.2;
      fill: none;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #a8a29e;
      margin-bottom: 32px;
      text-align: center;
      line-height: 1.5;
    }

    .retry-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 32px;
      border: none;
      background: #1c1917;
      color: #ffffff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .retry-btn:active {
      opacity: 0.8;
    }

    .status {
      margin-top: 16px;
      font-size: 11px;
      color: #a8a29e;
      min-height: 16px;
    }

    .bottom-text {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
      font-size: 11px;
      color: #89FFD4;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="icon-circle">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
  </div>

  <h1>无法连接网络</h1>
  <p class="subtitle">请检查你的网络连接后重试</p>

  <button class="retry-btn" onclick="retry()">重新连接</button>
  <p class="status" id="status"></p>

  <p class="bottom-text">车来车网</p>

  <script>
    function retry() {
      var status = document.getElementById('status');
      status.textContent = '正在连接...';

      fetch('https://www.clcauto.com/', { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
        .then(function() {
          status.textContent = '已连接，正在加载...';
          window.location.href = 'https://www.clcauto.com/';
        })
        .catch(function() {
          status.textContent = '连接失败，请稍后再试';
          setTimeout(function() { status.textContent = ''; }, 3000);
        });
    }

    // Auto-retry on network recovery
    window.addEventListener('online', function() {
      retry();
    });
  </script>
</body>
</html>
